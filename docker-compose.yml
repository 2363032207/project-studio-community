services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_SECRET: ${APP_SECRET}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD}
      APP_PORT: 8080
      QUALITY_SERVICE_URL: http://quality:8090
    depends_on:
      db:
        condition: service_healthy
      quality:
        condition: service_healthy

  quality:
    build: ./quality-service
    restart: unless-stopped
    environment:
      QUALITY_SERVICE_KEY: ${APP_SECRET}
    volumes:
      - quality-data:/data
    mem_limit: 2g
    cpus: 2
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8090/health',headers={'X-Quality-Key':os.environ['QUALITY_SERVICE_KEY']}),timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - api

volumes:
  postgres-data:
  quality-data:

